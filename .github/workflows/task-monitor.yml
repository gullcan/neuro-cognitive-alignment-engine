name: Notion task monitor

on:
  schedule:
    - cron: "*/15 * * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:
    inputs:
      observed_at:
        description: "Optional ISO timestamp for a deterministic manual test"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: notion-task-monitor
  cancel-in-progress: false

jobs:
  monitor-approved-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: "https://neuro-cognitive-alignment-engine.onrender.com"
      INTERNAL_API_KEY: ${{ secrets.RENDER_INTERNAL_API_KEY }}
      INPUT_OBSERVED_AT: ${{ inputs.observed_at }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          if [[ -z "$INTERNAL_API_KEY" ]]; then
            echo "Missing repository secret: RENDER_INTERNAL_API_KEY" >&2
            exit 1
          fi

      - name: Sync today's Notion plan and monitor tasks
        shell: bash
        run: |
          if [[ -n "$INPUT_OBSERVED_AT" ]]; then
            if [[ ! "$INPUT_OBSERVED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2})$ ]]; then
              echo "observed_at must be an ISO timestamp with a timezone" >&2
              exit 1
            fi
            plan_date="${INPUT_OBSERVED_AT:0:10}"
          else
            plan_date="$(TZ=Europe/Istanbul date +%F)"
          fi

          cycle_id="$(TZ=Europe/Istanbul date +%Y%m%d-%H%M)"
          sync_request_id="github-actions-sync-${cycle_id}"
          monitor_request_id="github-actions-monitor-${cycle_id}"
          sync_response_file="$(mktemp)"
          monitor_response_file="$(mktemp)"
          trap 'rm -f "$sync_response_file" "$monitor_response_file"' EXIT

          sync_status="$(curl \
            --silent \
            --show-error \
            --location \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 30 \
            --max-time 240 \
            --output "$sync_response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Internal-Api-Key: ${INTERNAL_API_KEY}" \
            --data "{\"plan_date\":\"${plan_date}\",\"request_id\":\"${sync_request_id}\"}" \
            "${API_URL}/v1/internal/scheduler/daily-plan")"

          if [[ ! "$sync_status" =~ ^2[0-9]{2}$ ]]; then
            echo "Notion plan sync failed with HTTP ${sync_status}" >&2
            sed -n '1,20p' "$sync_response_file" >&2
            exit 1
          fi

          echo "Notion plan sync accepted for ${plan_date} (HTTP ${sync_status})."

          if [[ -n "$INPUT_OBSERVED_AT" ]]; then
            monitor_body="{\"observed_at\":\"${INPUT_OBSERVED_AT}\",\"request_id\":\"${monitor_request_id}\"}"
          else
            monitor_body="{\"request_id\":\"${monitor_request_id}\"}"
          fi

          monitor_status="$(curl \
            --silent \
            --show-error \
            --location \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 30 \
            --max-time 240 \
            --output "$monitor_response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Internal-Api-Key: ${INTERNAL_API_KEY}" \
            --data "$monitor_body" \
            "${API_URL}/v1/internal/scheduler/task-monitor")"

          if [[ ! "$monitor_status" =~ ^2[0-9]{2}$ ]]; then
            echo "Task monitor failed with HTTP ${monitor_status}" >&2
            sed -n '1,20p' "$monitor_response_file" >&2
            exit 1
          fi

          echo "Task monitor cycle accepted (HTTP ${monitor_status})."
