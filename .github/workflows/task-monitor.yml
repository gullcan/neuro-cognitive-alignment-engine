name: Notion task monitor

on:
  schedule:
    - cron: "*/15 * * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:
    inputs:
      observed_at:
        description: "Optional ISO timestamp for a deterministic manual test"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: notion-task-monitor
  cancel-in-progress: false

jobs:
  monitor-approved-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: "https://neuro-cognitive-alignment-engine.onrender.com"
      INTERNAL_API_KEY: ${{ secrets.RENDER_INTERNAL_API_KEY }}
      INPUT_OBSERVED_AT: ${{ inputs.observed_at }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          if [[ -z "$INTERNAL_API_KEY" ]]; then
            echo "Missing repository secret: RENDER_INTERNAL_API_KEY" >&2
            exit 1
          fi

      - name: Trigger idempotent task monitor
        shell: bash
        run: |
          request_id="github-actions-monitor-$(TZ=Europe/Istanbul date +%Y%m%d-%H%M)"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          if [[ -n "$INPUT_OBSERVED_AT" ]]; then
            if [[ ! "$INPUT_OBSERVED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2})$ ]]; then
              echo "observed_at must be an ISO timestamp with a timezone" >&2
              exit 1
            fi
            request_body="{\"observed_at\":\"${INPUT_OBSERVED_AT}\",\"request_id\":\"${request_id}\"}"
          else
            request_body="{\"request_id\":\"${request_id}\"}"
          fi

          http_status="$(curl \
            --silent \
            --show-error \
            --location \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 30 \
            --max-time 240 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Internal-Api-Key: ${INTERNAL_API_KEY}" \
            --data "$request_body" \
            "${API_URL}/v1/internal/scheduler/task-monitor")"

          if [[ ! "$http_status" =~ ^2[0-9]{2}$ ]]; then
            echo "Task monitor failed with HTTP ${http_status}" >&2
            sed -n '1,20p' "$response_file" >&2
            exit 1
          fi

          echo "Task monitor cycle accepted (HTTP ${http_status})."
