services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: neuro_alignment
      POSTGRES_USER: neuro_alignment
      POSTGRES_PASSWORD: neuro_alignment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuro_alignment -d neuro_alignment"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
