[project]
name = "neuro-cognitive-alignment-engine"
version = "0.1.0"
description = "A stateful LangGraph multi-agent system for Notion planning and Telegram coaching."
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "agentic-ai",
    "fastapi",
    "langgraph",
    "multi-agent",
    "notion",
    "pgvector",
    "telegram-bot",
]
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.18,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langgraph-checkpoint-sqlite>=2,<4",
    "openai>=2.21,<3",
    "orjson>=3.10,<4",
    "pgvector>=0.4,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25.4,<26",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
neuro-alignment = "neuro_alignment.api:run"
neuro-alignment-start = "neuro_alignment.deployment:start"

[project.urls]
Documentation = "https://github.com/gullcan/neuro-cognitive-alignment-engine/tree/main/docs"
Repository = "https://github.com/gullcan/neuro-cognitive-alignment-engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro_alignment"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]
output_encoding = "utf-8"

[[tool.alembic.post_write_hooks]]
name = "ruff-check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff-format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
