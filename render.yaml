services:
  - type: web
    name: neuro-cognitive-alignment-engine
    runtime: docker
    repo: https://github.com/gullcan/neuro-cognitive-alignment-engine.git
    branch: main
    region: frankfurt
    plan: free
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: neuro-alignment-start
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: READINESS_TIMEOUT_SECONDS
        value: "5"
      - key: TIMEZONE
        value: Europe/Istanbul
      - key: DEFAULT_USER_ID
        value: owner
      - key: DATABASE_URL
        sync: false
      - key: CHECKPOINT_BACKEND
        value: postgres
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_DELIVERY_ENABLED
        value: "true"
      - key: OUTBOX_BATCH_SIZE
        value: "20"
      - key: OUTBOX_MAX_ATTEMPTS
        value: "5"
      - key: OUTBOX_LEASE_SECONDS
        value: "120"
      - key: INTERNAL_API_KEY
        generateValue: true
