services:
  - type: web
    name: neuro-cognitive-alignment-engine
    runtime: docker
    repo: https://github.com/gullcan/neuro-cognitive-alignment-engine.git
    branch: main
    region: frankfurt
    plan: free
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: neuro-alignment-start
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: READINESS_TIMEOUT_SECONDS
        value: "5"
      - key: TIMEZONE
        value: Europe/Istanbul
      - key: DEFAULT_USER_ID
        value: owner
      - key: DATABASE_URL
        sync: false
      - key: CHECKPOINT_BACKEND
        value: postgres
      - key: NOTION_API_TOKEN
        sync: false
      - key: NOTION_DATA_SOURCE_ID
        sync: false
      - key: NOTION_API_VERSION
        value: "2026-03-11"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_DELIVERY_ENABLED
        value: "true"
      - key: OUTBOX_BATCH_SIZE
        value: "20"
      - key: OUTBOX_MAX_ATTEMPTS
        value: "5"
      - key: OUTBOX_LEASE_SECONDS
        value: "120"
      - key: TASK_START_GRACE_MINUTES
        value: "15"
      - key: TASK_PROGRESS_DEFAULT_MINUTES
        value: "30"
      - key: BLOCKED_FOLLOW_UP_MINUTES
        value: "30"
      - key: DAY_RECOVERY_HOUR
        value: "20"
      - key: DAY_SUMMARY_HOUR
        value: "23"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: INTERNAL_API_KEY
        generateValue: true
